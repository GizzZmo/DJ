<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon DJ Mixer Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        :root {
            --bg: #080b12;
            --panel: rgba(17, 24, 39, 0.72);
            --card: rgba(28, 37, 58, 0.8);
            --accent: #00f5ff;
            --accent-2: #ff2df9;
            --text: #e5f4ff;
            --muted: #9fb3c8;
            --border: rgba(0, 245, 255, 0.35);
            --shadow: 0 0 25px rgba(0, 245, 255, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Rajdhani', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        body::before, body::after {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            background-image:
                radial-gradient(circle at 15% 20%, rgba(0, 245, 255, 0.08), transparent 25%),
                radial-gradient(circle at 80% 10%, rgba(255, 45, 249, 0.08), transparent 22%),
                radial-gradient(circle at 65% 80%, rgba(0, 245, 255, 0.05), transparent 20%);
            z-index: 0;
        }
        body::after {
            background-image:
                linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px),
                linear-gradient(0deg, rgba(255,255,255,0.05) 1px, transparent 1px);
            background-size: 120px 120px;
            opacity: 0.15;
        }
        ::selection {
            background: rgba(0, 245, 255, 0.35);
            color: #0b0f14;
        }
        .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            letter-spacing: 0.08em;
            text-shadow: 0 0 15px rgba(0, 245, 255, 0.35);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
        }
        .tagline {
            text-align: center;
            color: var(--muted);
            letter-spacing: 0.08em;
            margin-top: -18px;
            margin-bottom: 28px;
        }
        .mixer-panel {
            background: var(--panel);
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 30px rgba(0, 245, 255, 0.08);
            backdrop-filter: blur(8px);
        }
        .decks {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        .deck {
            background: var(--card);
            border-radius: 14px;
            padding: 20px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }
        .deck h2 {
            margin-bottom: 15px;
            color: var(--accent);
            letter-spacing: 0.12em;
            text-shadow: 0 0 10px rgba(0, 245, 255, 0.35);
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        button {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.2), rgba(255, 45, 249, 0.2));
            border: 1px solid rgba(0, 245, 255, 0.4);
            color: var(--text);
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
            flex: 1;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
        }
        button:hover {
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.35), rgba(255, 45, 249, 0.3));
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(0, 245, 255, 0.25);
        }
        button:active {
            transform: translateY(0);
        }
        button:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            box-shadow: 0 0 0 4px rgba(0, 245, 255, 0.15);
        }
        .slider-container {
            margin: 15px 0;
        }
        .slider-container label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            letter-spacing: 0.03em;
        }
        input[type="range"] {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: linear-gradient(90deg, rgba(0, 245, 255, 0.25), rgba(255, 45, 249, 0.2));
            outline: none;
            -webkit-appearance: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.4);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, #fff, var(--accent));
            cursor: pointer;
            box-shadow: 0 0 12px rgba(0, 245, 255, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .crossfader-section {
            text-align: center;
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 14px;
            border: 1px dashed rgba(0, 245, 255, 0.35);
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.35);
        }
        .crossfader-section h2 {
            margin-bottom: 20px;
            color: var(--accent);
            letter-spacing: 0.1em;
        }
        .status {
            font-size: 0.9em;
            color: var(--muted);
            margin-top: 10px;
        }
        .status.playing {
            color: #6bffb8;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(107, 255, 184, 0.45);
        }
        .master-controls {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }
        .init-button {
            background: linear-gradient(145deg, rgba(255, 45, 249, 0.45), rgba(0, 245, 255, 0.35));
            font-size: 1.2em;
            padding: 15px 40px;
            flex: initial;
            border-color: rgba(255, 45, 249, 0.6);
            box-shadow: 0 20px 45px rgba(255, 45, 249, 0.25);
        }
        .init-button:hover {
            background: linear-gradient(145deg, rgba(255, 45, 249, 0.6), rgba(0, 245, 255, 0.45));
        }
        .connection-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 12px 22px;
            background: linear-gradient(135deg, rgba(0, 245, 255, 0.18), rgba(255, 45, 249, 0.16));
            border-radius: 10px;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
            font-family: 'Orbitron', 'Rajdhani', sans-serif;
            letter-spacing: 0.06em;
        }
        .connection-status.disconnected {
            background: linear-gradient(135deg, rgba(255, 94, 94, 0.25), rgba(255, 45, 94, 0.2));
            border-color: rgba(255, 94, 94, 0.8);
        }
    </style>
</head>
<body>
    <div class="connection-status" id="connectionStatus">Connected</div>
    
    <div class="container">
        <h1>🎧 Neon DJ Mixer Console 🎧</h1>
        <p class="tagline">Cyberpunk control center for dual-deck mixing</p>
        
        <div class="mixer-panel">
            <div class="master-controls">
                <button class="init-button" onclick="initializeMixer()">Initialize Mixer</button>
                <div class="slider-container" style="flex: 1; margin-left: 30px;">
                    <label>Master Volume: <span id="masterVolumeValue">1.0</span></label>
                    <input type="range" id="masterVolume" min="0" max="1" step="0.01" value="1.0" 
                           oninput="setMasterVolume(this.value)">
                </div>
            </div>
        </div>
        
        <div class="mixer-panel">
            <div class="decks">
                <!-- Deck 1 -->
                <div class="deck">
                    <h2>DECK 1</h2>
                    <div class="controls">
                        <button onclick="playTrack('deck1')">▶ Play</button>
                        <button onclick="pauseTrack('deck1')">⏸ Pause</button>
                        <button onclick="stopTrack('deck1')">⏹ Stop</button>
                    </div>
                    <div class="slider-container">
                        <label>Volume: <span id="deck1VolumeValue">1.0</span></label>
                        <input type="range" id="deck1Volume" min="0" max="1" step="0.01" value="1.0"
                               oninput="setVolume('deck1', this.value)">
                    </div>
                    <div class="status" id="deck1Status">Status: Stopped</div>
                </div>
                
                <!-- Crossfader -->
                <div class="crossfader-section">
                    <h2>CROSSFADER</h2>
                    <div class="slider-container">
                        <label>Position: <span id="crossfaderValue">0.50</span></label>
                        <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5"
                               oninput="setCrossfader(this.value)" style="transform: rotate(90deg); width: 150px;">
                    </div>
                    <button onclick="applyCrossfader()">Apply Crossfader</button>
                </div>
                
                <!-- Deck 2 -->
                <div class="deck">
                    <h2>DECK 2</h2>
                    <div class="controls">
                        <button onclick="playTrack('deck2')">▶ Play</button>
                        <button onclick="pauseTrack('deck2')">⏸ Pause</button>
                        <button onclick="stopTrack('deck2')">⏹ Stop</button>
                    </div>
                    <div class="slider-container">
                        <label>Volume: <span id="deck2VolumeValue">1.0</span></label>
                        <input type="range" id="deck2Volume" min="0" max="1" step="0.01" value="1.0"
                               oninput="setVolume('deck2', this.value)">
                    </div>
                    <div class="status" id="deck2Status">Status: Stopped</div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        
        socket.on('connect', () => {
            console.log('Connected to server');
            document.getElementById('connectionStatus').textContent = 'Connected';
            document.getElementById('connectionStatus').classList.remove('disconnected');
        });
        
        socket.on('disconnect', () => {
            console.log('Disconnected from server');
            document.getElementById('connectionStatus').textContent = 'Disconnected';
            document.getElementById('connectionStatus').classList.add('disconnected');
        });
        
        socket.on('status_update', (status) => {
            updateUI(status);
        });
        
        function updateUI(status) {
            // Update master volume
            document.getElementById('masterVolume').value = status.master_volume;
            document.getElementById('masterVolumeValue').textContent = status.master_volume.toFixed(2);
            
            // Update crossfader
            document.getElementById('crossfader').value = status.crossfader;
            document.getElementById('crossfaderValue').textContent = status.crossfader.toFixed(2);
            
            // Update deck statuses
            ['deck1', 'deck2'].forEach(deck => {
                if (status.tracks[deck]) {
                    const volume = status.tracks[deck].volume;
                    const playing = status.tracks[deck].playing;
                    
                    document.getElementById(deck + 'Volume').value = volume;
                    document.getElementById(deck + 'VolumeValue').textContent = volume.toFixed(2);
                    
                    const statusEl = document.getElementById(deck + 'Status');
                    statusEl.textContent = 'Status: ' + (playing ? 'Playing' : 'Stopped');
                    statusEl.className = 'status ' + (playing ? 'playing' : '');
                }
            });
        }
        
        async function initializeMixer() {
            const response = await fetch('/api/initialize', { method: 'POST' });
            const data = await response.json();
            console.log('Initialize:', data);
        }
        
        async function playTrack(deck) {
            const response = await fetch(`/api/play/${deck}`, { method: 'POST' });
            const data = await response.json();
            console.log('Play:', data);
        }
        
        async function pauseTrack(deck) {
            const response = await fetch(`/api/pause/${deck}`, { method: 'POST' });
            const data = await response.json();
            console.log('Pause:', data);
        }
        
        async function stopTrack(deck) {
            const response = await fetch(`/api/stop/${deck}`, { method: 'POST' });
            const data = await response.json();
            console.log('Stop:', data);
        }
        
        async function setVolume(deck, volume) {
            document.getElementById(deck + 'VolumeValue').textContent = parseFloat(volume).toFixed(2);
            const response = await fetch(`/api/volume/${deck}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: parseFloat(volume) })
            });
        }
        
        async function setCrossfader(position) {
            document.getElementById('crossfaderValue').textContent = parseFloat(position).toFixed(2);
            const response = await fetch('/api/crossfader', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ position: parseFloat(position) })
            });
        }
        
        async function applyCrossfader() {
            const response = await fetch('/api/crossfader/apply', { method: 'POST' });
            const data = await response.json();
            console.log('Apply crossfader:', data);
        }
        
        async function setMasterVolume(volume) {
            document.getElementById('masterVolumeValue').textContent = parseFloat(volume).toFixed(2);
            const response = await fetch('/api/master-volume', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ volume: parseFloat(volume) })
            });
        }
        
        // Request status updates
        setInterval(() => {
            socket.emit('request_status');
        }, 1000);
    </script>
</body>
</html>
